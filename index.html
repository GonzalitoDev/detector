<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goku vs El Gordo</title>
<style>
  :root { --bg:#14102a; --fg:#fff; --goku:#ff8c1a; --gordo:#3fb6ff; --hp:#3ddc5a; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(circle at 50% 30%, #2d2260, var(--bg)); color:var(--fg);
         font-family:system-ui, sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { margin:8px 0 16px; font-size:clamp(22px,6vw,40px); text-shadow:0 0 12px #ffcc00; text-align:center; }
  .arena { display:flex; gap:16px; justify-content:space-between; width:100%; max-width:720px; }
  .fighter { flex:1; text-align:center; background:#ffffff10; border-radius:16px; padding:12px; }
  .avatar { font-size:clamp(60px,18vw,110px); transition:transform .15s; display:inline-block; }
  .hit { animation:shake .4s; }
  .attack { transform:scale(1.3); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px) rotate(-8deg)} 75%{transform:translateX(10px) rotate(8deg)} }
  .name { font-weight:800; font-size:20px; }
  .bar { height:16px; background:#0006; border-radius:8px; overflow:hidden; margin:8px 0 4px; }
  .bar > div { height:100%; background:var(--hp); transition:width .4s; }
  .ki > div { background:#ffd400; }
  small { opacity:.8; }
  .moves { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:720px; margin-top:16px; }
  button { font-size:16px; padding:14px; border:0; border-radius:12px; cursor:pointer; font-weight:700;
           background:var(--goku); color:#1a0d00; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  #log { width:100%; max-width:720px; margin-top:16px; background:#0005; border-radius:12px; padding:12px;
         min-height:120px; font-size:15px; line-height:1.5; }
  #log p { margin:0 0 4px; }
  .ssj { filter:drop-shadow(0 0 18px #ffe600) drop-shadow(0 0 30px #ffb300); animation:aura 0.6s infinite alternate; }
  @keyframes aura { from{filter:drop-shadow(0 0 10px #ffe600)} to{filter:drop-shadow(0 0 32px #ffb300)} }
  .big { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column;
         background:#000c; font-size:clamp(28px,8vw,56px); font-weight:900; text-align:center; padding:16px; }
  .big button { margin-top:20px; font-size:20px; }
</style>
</head>
<body>
<h1>⚡ GOKU vs EL GORDO 🍔</h1>
<div class="arena">
  <div class="fighter">
    <div class="avatar" id="av-goku">🥋</div>
    <div class="name" style="color:var(--goku)">Goku</div>
    <div class="bar"><div id="hp-goku"></div></div><small id="txt-goku"></small>
    <div class="bar ki"><div id="ki-goku"></div></div><small>Ki</small>
  </div>
  <div class="fighter">
    <div class="avatar" id="av-gordo">🫃</div>
    <div class="name" style="color:var(--gordo)">El Gordo</div>
    <div class="bar"><div id="hp-gordo"></div></div><small id="txt-gordo"></small>
    <div class="bar ki"><div id="ki-gordo"></div></div><small>Hambre</small>
  </div>
</div>
<div class="moves" id="mv-goku">
  <button data-m="punio">👊 Piña voladora</button>
  <button data-m="cargar">🔥 Cargar Ki (+35)</button>
  <button data-m="kame">🌊 KAMEHAMEHA (50 ki)</button>
  <button data-m="genki">🌍 Genkidama (100 ki)</button>
</div>
<div id="habla" style="width:100%;max-width:720px;margin-top:12px;padding:12px;border-radius:12px;background:#3fb6ff22;min-height:48px;font-style:italic">🫃💬 <span id="habla-txt">...</span> <small style="opacity:.6">(IA)</small></div>
<div id="log"></div>
<div class="big" id="final"><div id="final-txt"></div><button onclick="reset()">🔁 Revancha</button></div>

<script>
const MOVES = {
  punio:  { ki:0,   dmg:[8,15],  txt:"Goku le encaja una piña voladora" },
  cargar: { ki:-35, dmg:[0,0],   txt:"Goku grita AAAAAHHHH y carga ki" },
  kame:   { ki:50,  dmg:[22,32], txt:"KAAA-MEEE-HAAA-MEEE-HAAAAA!!!" },
  genki:  { ki:100, dmg:[45,60], txt:"¡Goku tira una Genkidama gigante!" },
};
const GORDO = [
  { dmg:[8,14],  txt:"El Gordo te tira un panzazo sísmico 🫃💥" },
  { dmg:[10,16], txt:"El Gordo suelta un eructo nivel 9000 🤢" },
  { dmg:[12,20], txt:"El Gordo hace el Choripán Kamehameha 🌭🔥" },
  { dmg:[0,0],   txt:"El Gordo se distrae pidiendo una pizza 🍕 (no hace nada)" },
  { heal:[15,25],txt:"El Gordo se come un asado entero y recupera vida 🥩" },
  { dmg:[18,26], txt:"El Gordo se sienta encima de Goku 😵", hungry:true },
];
const ZAS = ["¡ZAS!","¡PUM!","¡CRACK!","¡BOOM!","¡PAF!"];
let s;
const $ = id => document.getElementById(id);
const rnd = ([a,b]) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];

// IA gratis (Pollinations, sin clave). Si falla, usa frases locales.
const FRASES = ["¡Ese golpe me hizo cosquillas, Kakaroto!","Pará que termino el choripán y te fajo.","¿Eso es todo? Mi abuela pega más fuerte.","Después de esta me pido una muzza grande 🍕","¡Te voy a aplastar como milanesa!"];
let hablando = false;
async function hablaGordo(situacion) {
  if (hablando) return; hablando = true;
  const el = $("habla-txt"); el.textContent = "pensando... 🤔";
  const prompt = `Sos "El Gordo", un personaje argentino gracioso y bonachón que pelea contra Goku en un juego. Situación: ${situacion}. Respondé con UNA sola frase corta (máximo 15 palabras) de trash talk gracioso, en español rioplatense, con referencias a comida. Sin insultos fuertes. Solo la frase.`;
  try {
    const ctrl = new AbortController(); setTimeout(()=>ctrl.abort(), 8000);
    const r = await fetch("https://text.pollinations.ai/" + encodeURIComponent(prompt) + "?model=openai&seed=" + Math.floor(Math.random()*1e6), { signal: ctrl.signal });
    if (!r.ok) throw 0;
    const t = (await r.text()).trim().replace(/^"|"$/g,"").slice(0,160);
    if (!t) throw 0;
    el.textContent = t;
  } catch (e) { el.textContent = pick(FRASES); }
  hablando = false;
}
function situacion() { return `Goku tiene ${s.goku} de vida, El Gordo tiene ${s.gordo}. Última jugada: ${$("log").firstChild?.textContent || "empieza la pelea"}`; }
function reset() {
  s = { goku:100, gordo:130, ki:20, hambre:0, busy:false, ssj:false, turnoGordo:false };
  $("av-goku").textContent="🥋"; $("av-goku").classList.remove("ssj");
  $("log").innerHTML = "";
  $("final").style.display = "none";
  log("🔔 ¡Arranca la pelea del siglo!");
  render();
  hablaGordo("empieza la pelea, provocá a Goku");
}
function log(t) { const p=document.createElement("p"); p.textContent=t; $("log").prepend(p); }
function render() {
  $("hp-goku").style.width = s.goku + "%";
  $("hp-gordo").style.width = (s.gordo/130*100) + "%";
  $("txt-goku").textContent = s.goku + " HP";
  $("txt-gordo").textContent = s.gordo + " HP";
  $("ki-goku").style.width = s.ki + "%";
  $("ki-gordo").style.width = s.hambre + "%";
  document.querySelectorAll("button[data-m]").forEach(b => {
    const m = MOVES[b.dataset.m];
    b.disabled = s.busy || s.turnoGordo || (m.ki > 0 && s.ki < m.ki);
  });
}
function anim(id, cls) { const e=$(id); e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); setTimeout(()=>e.classList.remove(cls),400); }
function beep(f) { try { const c=new (window.AudioContext||window.webkitAudioContext)(), o=c.createOscillator(), g=c.createGain();
  o.frequency.value=f; o.type="square"; g.gain.value=.05; o.connect(g); g.connect(c.destination); o.start();
  g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+.25); o.stop(c.currentTime+.3); } catch(e){} }

function turno(key) {
  if (s.busy) return;
  const m = MOVES[key];
  s.ki = Math.min(100, s.ki - m.ki);
  anim("av-goku","attack");
  if (m.dmg[1]) {
    let d = rnd(m.dmg);
    const crit = Math.random() < .15;
    if (crit) d = Math.round(d*1.5);
    if (s.ssj) d = Math.round(d*1.5);
    if (Math.random() < .1) { log("😂 " + m.txt + "... ¡pero El Gordo lo esquiva rodando!"); }
    else {
      s.gordo = Math.max(0, s.gordo - d);
      anim("av-gordo","hit"); beep(crit?880:440);
      log(`${pick(ZAS)} ${m.txt} → -${d}${crit?" 💥CRÍTICO":""}`);
    }
  } else { log("⚡ " + m.txt); beep(660); }
  if (!fin()) hablaGordo(situacion());
  if (fin()) return;
  s.busy = true; render();
  setTimeout(gordoTurno, 900);
}
function gordoTurno() {
  let a = pick(GORDO);
  s.hambre = Math.min(100, s.hambre + 20);
  if (s.hambre >= 100) {
    s.hambre = 0;
    a = { dmg:[28,38], txt:"🍔🍕🌭 ¡MODO GORDO FURIOSO! El Gordo hace la AVALANCHA DE MILANESAS" };
  }
  anim("av-gordo","attack");
  if (a.heal) { const h=rnd(a.heal); s.gordo=Math.min(130,s.gordo+h); log(`${a.txt} → +${h}`); }
  else if (a.dmg[1]) { const d=rnd(a.dmg); s.goku=Math.max(0,s.goku-d); anim("av-goku","hit"); beep(220); log(`${a.txt} → -${d}`); }
  else log(a.txt);
  s.ki = Math.min(100, s.ki + 5);
  s.busy = false; render(); if (!fin()) checkSSJ();
}
function checkSSJ() {
  if (s.ssj || s.goku > 35) return;
  s.ssj = true; s.goku = Math.min(100, s.goku + 25); s.ki = 100;
  $("av-goku").textContent = "😡"; $("av-goku").classList.add("ssj");
  log("💛⚡ ¡¡GOKU SE TRANSFORMÓ EN SUPER SAIYAJIN!! (+25 HP, ki al máximo, daño x1.5)");
  [440,660,880,1100].forEach((f,i)=>setTimeout(()=>beep(f),i*120));
  render();
}
function fin() {
  if (s.gordo > 0 && s.goku > 0) return false;
  const gana = s.gordo <= 0;
  $("final-txt").innerHTML = gana
    ? "🏆 ¡GANÓ GOKU!<br><small>El Gordo se fue a comer un pancho para consolarse 🌭</small>"
    : "🍔 ¡GANÓ EL GORDO!<br><small>Goku quedó aplastado. Se viene la revancha 😤</small>";
  $("final").style.display = "flex";
  hablaGordo(gana ? "El Gordo perdió la pelea, lamentate gracioso" : "El Gordo ganó la pelea, festejá");
  s.busy = true; render();
  return true;
}
document.querySelectorAll("button[data-m]").forEach(b => b.onclick = () => turno(b.dataset.m));
reset();
</script>
</body>
</html>
