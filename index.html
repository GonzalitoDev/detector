<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goku vs El Gordo</title>
<meta name="description" content="Pelea épica y juego de cartas: Goku contra El Gordo, con IA gratis.">
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; color:#fff; font-family:system-ui,sans-serif; overflow-x:hidden;
         background:radial-gradient(circle at 50% 20%, #3a2a80, #14102a 70%); display:flex; flex-direction:column; align-items:center; padding:24px 16px; }
  #estrellas { position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:radial-gradient(2px 2px at 20% 30%,#fff8,transparent),radial-gradient(2px 2px at 70% 60%,#fff6,transparent),
    radial-gradient(1px 1px at 40% 80%,#fff8,transparent),radial-gradient(2px 2px at 85% 15%,#fff7,transparent),radial-gradient(1px 1px at 10% 70%,#fff9,transparent);
    background-size:300px 300px; animation:cielo 40s linear infinite; }
  @keyframes cielo { to{background-position:300px 600px} }
  .vs { display:flex; align-items:center; gap:clamp(10px,4vw,30px); font-size:clamp(60px,18vw,120px); margin-top:10px; }
  .vs span:nth-child(1) { animation:izq 1.2s ease-in-out infinite alternate; }
  .vs span:nth-child(3) { animation:der 1.2s ease-in-out infinite alternate; }
  .vs b { font-size:clamp(28px,8vw,52px); color:#ffd400; text-shadow:0 0 20px #ff6a00; animation:late 0.8s infinite alternate; }
  @keyframes izq { to { transform:translateX(12px) rotate(8deg); } }
  @keyframes der { to { transform:translateX(-12px) rotate(-8deg); } }
  @keyframes late { to { transform:scale(1.25); } }
  h1 { margin:8px 0 4px; font-size:clamp(28px,8vw,56px); text-align:center; text-shadow:0 0 16px #ffcc00, 0 4px 0 #000; letter-spacing:1px; }
  .sub { opacity:.8; margin-bottom:24px; text-align:center; }
  .modos { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; width:100%; max-width:640px; }
  .modo { display:block; text-decoration:none; color:inherit; border-radius:18px; padding:20px; text-align:center;
          background:linear-gradient(160deg,#ff8c1a33,#ffffff10); border:2px solid #ff8c1a; transition:transform .2s, box-shadow .2s; }
  .modo.c { background:linear-gradient(160deg,#3fb6ff33,#ffffff10); border-color:#3fb6ff; }
  .modo:hover { transform:translateY(-6px) scale(1.02); box-shadow:0 12px 30px #000a, 0 0 24px #ffd40066; }
  .modo .ico { font-size:52px; }
  .modo h2 { margin:6px 0; }
  .modo p { margin:0 0 10px; opacity:.85; font-size:14px; }
  .modo small { opacity:.7; }
  .panel { width:100%; max-width:640px; margin-top:20px; background:#0005; border-radius:16px; padding:16px; }
  .panel h3 { margin:0 0 10px; }
  .fila { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .op { padding:10px 14px; border-radius:10px; border:0; font-weight:700; font-size:15px; cursor:pointer; background:#ffffff22; color:#fff; }
  .op.on { background:#ffd400; color:#000; }
  footer { margin-top:24px; opacity:.5; font-size:12px; text-align:center; }
</style>
</head>
<body>
<div id="estrellas"></div>
<div class="vs"><span>🥋</span><b>VS</b><span>🫃</span></div>
<h1>GOKU vs EL GORDO</h1>
<div class="sub">La pelea más épica (y con más milanesas) de la historia</div>

<div class="modos">
  <a class="modo" href="pelea.html">
    <div class="ico">⚡</div><h2>Pelea</h2>
    <p>Kamehameha, Super Saiyajin, eventos locos y El Gordo pensando con IA.</p>
    <small id="rec-pelea"></small>
  </a>
  <a class="modo c" href="cartas.html">
    <div class="ico">🃏</div><h2>Cartas</h2>
    <p>Armá tu estrategia con cartas animadas. Energía, escudos y combos.</p>
    <small id="rec-cartas"></small>
  </a>
</div>

<div class="panel">
  <h3>⚙️ Ajustes</h3>
  <div class="fila">Dificultad:
    <button class="op" data-d="facil">😌 Fácil</button>
    <button class="op" data-d="normal">😤 Normal</button>
    <button class="op" data-d="dificil">💀 Difícil</button>
  </div>
  <div class="fila">Sonido: <button class="op" id="snd"></button></div>
  <div class="fila"><button class="op" id="borrar">🗑️ Borrar récord</button></div>
</div>

<footer>Hecho con mucho choripán 🌭</footer>

<script src="comun.js"></script>
<script>
function render() {
  document.querySelectorAll("[data-d]").forEach(b => b.classList.toggle("on", b.dataset.d === AJUSTES.dificultad));
  const snd = document.getElementById("snd");
  snd.textContent = AJUSTES.sonido ? "🔊 Activado" : "🔇 Apagado"; snd.classList.toggle("on", AJUSTES.sonido);
  for (const j of ["pelea", "cartas"]) {
    const r = AJUSTES.record(j);
    document.getElementById("rec-" + j).textContent = r.g + r.p ? `🏆 ${r.g} ganadas · 💀 ${r.p} perdidas` : "Todavía no jugaste";
  }
}
document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { AJUSTES.dificultad = b.dataset.d; render(); });
document.getElementById("snd").onclick = () => { AJUSTES.sonido = !AJUSTES.sonido; render(); };
document.getElementById("borrar").onclick = () => { try { localStorage.removeItem("record-pelea"); localStorage.removeItem("record-cartas"); } catch (e) {} render(); };
render();
</script>
</body>
</html>
